[package]
name = "megumi-whatsapp"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23"
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "c65b4028ace77da161824d95530e2b002b9ec332", version = "0.7.0", features = ["tracing"] }
qrcode = "0.14"
rustfft = "6.4"
tokio = { version = "1.53.1", features = ["full"] }
tracing = { version = "0.1.44", features = ["async-await", "attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
megumi = { package = "megumi-framework", path = "crates/megumi-framework" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }
rand = "0.10.3"
crc32fast = "1.5.2"
byteorder = "1.5.0"
image = "0.25.10"
dotenvy = "0.15"
chrono = "0.4.45"

[workspace]
members = ["crates/megumi-framework", "crates/megumi-framework-macros"]
resolver = "3"
