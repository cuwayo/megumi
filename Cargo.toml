[package]
name = "megumi-whatsapp"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23"
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "c65b4028ace77da161824d95530e2b002b9ec332", version = "0.7.0", features = ["tracing"] }
qrcode = "0.14"
rustfft = "6.4"
tokio = { version = "1.53.1", features = ["full"] }
tracing = { version = "0.1.44", features = ["async-await", "attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
megumi = { package = "megumi-framework", path = "crates/megumi-framework" }
megumi-agent = { path = "crates/megumi-agent" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }
rand = "0.10.3"
crc32fast = "1.5.2"
byteorder = "1.5.0"
image = "0.25.10"
flate2 = "1.1.10"
thorvg = "0.5.1"
webp-animation = "0.10.0"
dotenvy = "0.15"
chrono = "0.4.45"

[workspace]
members = [
    "crates/megumi-framework",
    "crates/megumi-framework-macros",
    "crates/megumi-agent",
]
resolver = "3"

# The vendored webp-animation carries the `EncodingConfig::method` fix that
# upstream 0.10.0 is missing. It stays out of the workspace so CI's fmt and
# clippy gates keep judging only this repository's code; its own test is run
# from its manifest (see vendor/webp-animation/PATCH.md).
[patch.crates-io]
webp-animation = { path = "vendor/webp-animation" }
