[package]
name = "megumi-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "time"] }
tracing = { version = "0.1.44", features = ["async-await", "attributes"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
